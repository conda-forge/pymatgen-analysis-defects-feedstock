{% set name = "pymatgen-analysis-defects" %}
{% set version = "2026.10.24" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 0fbf16ca02a890322c348e8bd2f74b099de6dfcceaef51e09941a0ddb43675a1

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
    - versioningit
  run:
    - python >=3.9
    - pymatgen >=2024.10.22
    - scikit-image >=0.19.3
    - numpy
    - mp-pyrho >=0.4.4

test:
  imports:
    - pymatgen.analysis.defects
    - pymatgen.analysis.defects.core

about:
  home: https://github.com/materialsproject/pymatgen-analysis-defects
  # See https://github.com/materialsproject/pymatgen-analysis-defects/issues/60
  license: BSD-3-Clause-LBNL
  license_family: BSD
  license_file: LICENSE
  summary: Defect analysis modules for pymatgen
  doc_url: https://materialsproject.github.io/pymatgen-analysis-defects/
  dev_url: https://github.com/materialsproject/pymatgen-analysis-defects

extra:
  recipe-maintainers:
    - njzjz
